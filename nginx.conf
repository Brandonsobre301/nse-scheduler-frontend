server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # This location block handles all requests for your React application's files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # This block will now correctly handle all API requests.
  # The trailing slash is important.
  location /api/ {
    # This command forwards the request to your backend container.
    # The trailing slash on the URL is crucial. It tells Nginx to
    # pass the rest of the path to the backend.
    # e.g., a request to /api/auth/login becomes a request to http://backend:5000/auth/login
    proxy_pass http://backend:5000/;
    
    # These lines are standard practice for ensuring the backend
    # receives the correct information about the original request.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-NginX-Proxy true;
  }
}

