server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression for faster transfers
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Cache static assets (JS, CSS, images) — CRA uses content hashes in filenames
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — serve index.html for all client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Estimate route is mounted on the backend WITH the /api/v1 prefix, unlike /auth and /projects — keep it intact
  location /api/v1/ {
    proxy_pass http://backend:5000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Reverse proxy API requests to the backend container
  # /api/auth/login → http://backend:5000/auth/login
  location /api/ {
    proxy_pass http://backend:5000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

